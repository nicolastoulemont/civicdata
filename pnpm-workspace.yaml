packages:
  - apps/*
  - packages/*

# Supply chain. The repo is public, so treat every dependency change as untrusted.
# pnpm only installs versions published at least one day ago, which leaves the
# registry time to pull a compromised release. Setting it explicitly turns on
# minimumReleaseAgeStrict.
minimumReleaseAge: 1440
# Fail when a package loses the provenance or trusted publisher it had before.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Recharts 3.8 pins 5.1.1. Its maintainer Mark Erikson (acemarke) published
  # it by hand in June 2024 without the provenance 5.1.0 had; the published
  # gitHead is the commit just before the "Release 5.1.1" version bump. 5.2.0+
  # have provenance again. Checked 2026-11-08.
  - reselect@5.1.1
# Transitive dependencies may not come from git or tarball URLs.
blockExoticSubdeps: true
# Install fails on any dependency build script not reviewed below.
strictDepBuilds: true
allowBuilds:
  # Verifies the platform binary that Alchemy dev runs.
  workerd: true
  # Its postinstall only checks the platform binary, which pnpm installs as
  # an optional dependency anyway.
  esbuild: false

overrides:
  # GHSA-g3hv-75wg-m249: minimatch below 11.0.1 can be driven into a denial of
  # service by brace patterns. Only the shadcn CLI reaches it, through
  # ts-morph, whose latest release still asks for ^10. ts-morph only calls
  # minimatch(), which 11 keeps. Drop this once @ts-morph/common allows 11.
  "@ts-morph/common>minimatch": ^11.0.1
  # GHSA-3g3m-2fjr-6pw4: glob 9.0.0 to 14.0.1 keeps walking the filesystem
  # after its AbortSignal fires. Only Storybook reaches it, through
  # @joshwooding/vite-plugin-react-docgen-typescript 0.7.0, whose latest
  # release still asks for ^13. The plugin only calls globSync(), which 14
  # keeps, and Storybook loads it only with reactDocgen "react-docgen-typescript",
  # which we do not set. Drop this once the plugin allows 14.0.2.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.2

catalog:
  "@effect/vitest": 4.1.2
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.2.0
  effect: 4.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  vitest: ^5.1.0

# `effect-tsgo patch` (the root prepare script) rewrites the TypeScript binary
# in node_modules so editors load the Effect plugin. A hardlinked file would
# carry that write back into the shared store, so never hardlink.
packageImportMethod: clone-or-copy
