name: Gather series

# Starts one run of a stage's gathering Workflow, besides its daily 05:00 UTC
# schedule. Deploys start none, so this is how a new pull request preview, or
# prod after a change to what a run stores, gets its series before the next
# 05:00. Run it from the Actions tab or with
# `gh workflow run gather.yml -f stage=pr-123`.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage: prod, or pr-<number>"
        required: true
        type: string

permissions: {}

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # The production environment only accepts runs from main.
    environment: ${{ inputs.stage == 'prod' && 'production' || 'preview' }}
    env:
      STAGE: ${{ inputs.stage }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # The Workflow's name follows packages/infra/alchemy.run.ts:
      # civicdata-<stage>-gather.
      - name: Start a gathering run
        run: |
          if [[ ! "$STAGE" =~ ^(prod|pr-[0-9]+)$ ]]; then
            echo "::error::Stage must be prod or pr-<number>"
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/civicdata-$STAGE-gather/instances" > /dev/null
