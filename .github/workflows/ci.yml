name: CI

on:
  # Adding or removing the own-catalog label redeploys the preview: with it,
  # the preview gets its own catalog and store; without it, it reads
  # production's (docs/deploys.md). Other labels change nothing.
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]

# Every job asks for the permissions it needs, and nothing else.
permissions: {}

jobs:
  check:
    if: >-
      github.event.action != 'closed'
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
        || github.event.label.name == 'own-catalog')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      # Keep package checks across runners, so changing web does not rerun maps.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &task-cache
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:lint
      - run: pnpm fallow
      - run: pnpm turbo run typecheck test build

  dependency-review:
    if: >-
      github.event_name == 'pull_request'
      && contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # Fork pull requests never reach the deploy jobs: they get no secrets, and the
  # repository check below skips them. Dependabot pull requests only see
  # Dependabot secrets, so they skip previews too.
  preview:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    environment: preview
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.url.outputs.url }}
      open: ${{ steps.pr.outputs.open }}
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      # Read when the deploy starts, not from the event. OPEN is "false" once
      # the pull request has closed: this job joins the deploy-pr group only
      # after check passes, so a pull request merged while check runs gets
      # its cleanup first, which finds no stage, and this job after it.
      # Deploying then would leave a stage, with its Workflows, that nothing
      # removes, so the job destroys the stage instead. OWN_CATALOG is "true"
      # with the own-catalog label and "false" without; without it, the stack
      # binds production's catalog and store and deploys no Workflow
      # (docs/deploys.md). `gh pr create --label` adds the label after the
      # pull request opens, so the opened event carries none.
      - name: Read the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR")
          open=$(jq -r '.state == "open"' <<< "$pr")
          own=$(jq -r 'any(.labels[]; .name == "own-catalog")' <<< "$pr")
          echo "OPEN=$open" >> "$GITHUB_ENV"
          echo "OWN_CATALOG=$own" >> "$GITHUB_ENV"
          echo "open=$open" >> "$GITHUB_OUTPUT"
      - if: env.OPEN == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *task-cache
      - if: env.OPEN == 'true'
        run: pnpm turbo run build --filter=@repo/maps
      - if: env.OPEN == 'true'
        run: pnpm --filter @repo/infra exec alchemy deploy --yes --stage "$STAGE"
      - if: env.OPEN == 'false'
        run: pnpm --filter @repo/infra exec alchemy destroy --yes --stage "$STAGE"
      # In CI, Alchemy prints log lines and status messages to stdout before the
      # value, which it prints last as indented JSON. Parse from its opening
      # brace. The stack output comes from pull request code, so accept a bare
      # https origin only before it reaches the comment.
      - id: url
        if: env.OPEN == 'true'
        run: |
          output=$(pnpm --silent --filter @repo/infra exec alchemy state cat "civicdata/$STAGE/output" --log-level=none --no-input)
          if ! url=$(sed -n '/^{/,$p' <<< "$output" | jq -er .url); then
            echo "::error::Could not read the preview URL from the stack output"
            printf '%s\n' "$output"
            exit 1
          fi
          if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Unexpected preview URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # A new stage has no catalog until a build publishes one, and a deploy
      # may change what a build stores, so each deploy starts a build;
      # production's Workflow also builds weekly. A preview without the
      # own-catalog label reads production's catalog and has no catalog
      # Workflow, so it starts none, and neither does a destroyed one;
      # production sets neither OWN_CATALOG nor OPEN. The name comes from the
      # stack output, which pull request code writes, so it must be this
      # stage's own before use.
      - &build
        name: Start a catalog build
        if: env.OWN_CATALOG != 'false' && env.OPEN != 'false'
        run: |
          output=$(pnpm --silent --filter @repo/infra exec alchemy state cat "civicdata/$STAGE/output" --log-level=none --no-input)
          if ! name=$(sed -n '/^{/,$p' <<< "$output" | jq -er .catalog); then
            echo "::error::Could not read the catalog Workflow from the stack output"
            printf '%s\n' "$output"
            exit 1
          fi
          if [[ "$name" != "civicdata-$STAGE-catalog" ]]; then
            echo "::error::Unexpected catalog Workflow name"
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/$name/instances" > /dev/null

  # The preview comment jobs hold the only write token, and they never check
  # out or run pull request code.
  preview-started:
    needs: check
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      STATE: deploying
      URL: ""
    steps:
      - &comment
        name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- civicdata-preview -->"
          case "$STATE" in
            deploying) status="🔵 Deploying" ;;
            success) status="🟢 [Ready]($URL)" ;;
            cancelled) status="🔴 Cancelled" ;;
            removed) status="⚫ Removed" ;;
            *) status="🔴 Failed" ;;
          esac
          body="$marker
          ### Preview

          | Status | Commit | Logs |
          | :-- | :-- | :-- |
          | $status | \`${SHA:0:7}\` | [Run]($RUN_URL) |"
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          # A pull request that closes without a preview comment never had a
          # preview, so there is nothing to report.
          elif [[ "$ACTION" != closed ]]; then
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  preview-status:
    needs: [preview-started, preview]
    # Runs after a failed or cancelled deploy too, so the comment never stays blue.
    if: always() && needs.preview-started.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      STATE: ${{ needs.preview.result == 'success' && needs.preview.outputs.open == 'false' && 'removed' || needs.preview.result }}
      URL: ${{ needs.preview.outputs.url }}
    steps:
      - *comment

  production:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The production environment only accepts deployments from main.
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      STAGE: prod
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *task-cache
      - run: pnpm turbo run build --filter=@repo/maps
      - run: pnpm --filter @repo/infra exec alchemy deploy --yes --stage "$STAGE"
      - *build

  # Destroys a closed pull request's stage. One merged while its check runs
  # reaches this job before its preview deploys: the destroy finds no stage,
  # and the preview job, which reads the pull request when it starts,
  # destroys the stage instead of deploying it.
  cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: preview
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - run: pnpm --filter @repo/infra exec alchemy destroy --yes --stage "$STAGE"

  preview-removed:
    needs: cleanup
    # A failed destroy may leave the preview running, so the comment says Failed
    # and links the run instead of Removed.
    if: always() && needs.cleanup.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      STATE: ${{ needs.cleanup.result == 'success' && 'removed' || needs.cleanup.result }}
      URL: ""
    steps:
      - *comment
