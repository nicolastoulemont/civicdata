name: Gather papers

# Starts one run of a stage's PaperGather Workflow, which gathers new and
# updated papers from OpenAlex into the paper store (docs/papers.md#weekly-gather).
# Only prod's runs on a schedule, every Monday at 03:00 UTC, and deploys
# start none, so this is how a pull request preview with the own-catalog
# label runs its paper gather code against its own store, and how prod
# gathers before next Monday. A preview without the label reads production's
# paper store and has no PaperGather Workflow, so it is refused. The run
# calls no model. Run it from the Actions tab or with
# `gh workflow run paper-gather.yml -f stage=pr-123`.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage: prod, or pr-<number>"
        required: true
        type: string

permissions: {}

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # The production environment only accepts runs from main.
    environment: ${{ inputs.stage == 'prod' && 'production' || 'preview' }}
    env:
      STAGE: ${{ inputs.stage }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # The Workflow's name follows packages/infra/alchemy.run.ts:
      # civicdata-<stage>-paper-gather.
      - name: Start a paper gather run
        run: |
          if [[ ! "$STAGE" =~ ^(prod|pr-([0-9]+))$ ]]; then
            echo "::error::Stage must be prod or pr-<number>"
            exit 1
          fi
          pr=${BASH_REMATCH[2]}
          if [[ -n "$pr" ]]; then
            labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
            if ! grep -qx own-catalog <<< "$labels"; then
              echo "::error::#$pr has no own-catalog label: its preview reads production's paper store and has no PaperGather Workflow"
              exit 1
            fi
          fi
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workflows/civicdata-$STAGE-paper-gather/instances" > /dev/null
